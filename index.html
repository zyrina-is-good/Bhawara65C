<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhawara 65'C</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --nav-height: 70px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }
        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 60%);
            border-radius: 50%;
            top: -200px;
            left: -200px;
            opacity: 0.3;
            filter: blur(80px);
            z-index: -1;
            animation: float 10s ease-in-out infinite alternate;
        }
        .bg-glow-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
            border-radius: 50%;
            bottom: -100px;
            right: -100px;
            opacity: 0.3;
            filter: blur(80px);
            z-index: -1;
            animation: float 8s ease-in-out infinite alternate-reverse;
        }
        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--nav-height);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            letter-spacing: -0.5px;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-item {
            padding: 8px 16px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .nav-item:hover, .nav-item.active {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }
        .nav-item.active {
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05);
        }
        main {
            margin-top: var(--nav-height);
            min-height: calc(100vh - var(--nav-height));
            position: relative;
        }
        #intro-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - var(--nav-height));
            text-align: center;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hero-badge {
            padding: 6px 16px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            max-width: 800px;
        }
        .subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .btn-group {
            display: flex;
            gap: 16px;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(59, 130, 246, 0.4);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        .dropdown {
            position: relative;
            display: flex;
            align-items: center;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: rgba(15, 23, 42, 0.95);
            min-width: 180px;
            box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            z-index: 101;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            overflow: hidden;
            backdrop-filter: blur(10px);
            margin-top: 5px;
        }
        .dropdown-content.show {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }
        .dropdown-content a {
            color: var(--text-muted);
            padding: 12px 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            transition: 0.3s;
            cursor: pointer;
        }
        .dropdown-content a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>
    <nav>
        <div class="logo" onclick="loadPage('home')">Bhawara 65'C</div>
        <div class="nav-links">
            <a class="nav-item active" id="nav-home" onclick="loadPage('home')">Home</a>
            <a class="nav-item" id="nav-quiz" onclick="loadPage('quiz')">Quiz</a>
            <div class="dropdown">
                <a class="nav-item" id="nav-seat-order" onclick="toggleDropdown(event)">Seat Order ▼</a>
                <div class="dropdown-content" id="seat-order-dropdown">
                    <a onclick="loadPage('seat-view'); closeDropdown();">👁️ Lihat Denah</a>
                    <a onclick="loadPage('seat-register'); closeDropdown();">📝 Register Kursi</a>
                </div>
            </div>
            <a class="nav-item" id="nav-schedule" onclick="loadPage('schedule')">Schedule</a>
        </div>
    </nav>
    <main>
        <section id="intro-section">
            <div class="hero-badge">Bhawara 65'C Web Portal</div>
            <h1>Selamat Datang di Kelas 65'C</h1>
            <p class="subtitle">
                Web yang dibuat oleh kelas 65'C untuk memudahkan siswa dalam belajar dan mengakses informasi.
            </p>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="loadPage('quiz')">
                    Mulai Quiz
                </button>
                <button class="btn btn-secondary" onclick="loadPage('seat-view')">
                    Lihat Denah Kelas
                </button>
            </div>
        </section>
        <div id="loading-indicator" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; color: white;">
            <div style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
            <div>Mengalihkan Halaman...</div>
        </div>
    </main>
    <script>
        const pages = {
            'home': null,
            'quiz': './frontend/dist/index.html',
            'seat-view': './seat-orders/index.html?mode=view',
            'seat-register': './seat-orders/index.html?mode=register',
            'schedule': './schedule/index.html'
        };
        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById("seat-order-dropdown").classList.toggle("show");
        }
        function closeDropdown() {
            document.getElementById("seat-order-dropdown").classList.remove("show");
        }
        window.onclick = function (event) {
            if (!event.target.matches('#nav-seat-order')) {
                closeDropdown();
            }
        }
        function loadPage(pageId) {
            if (pageId === 'home') {
                window.location.href = '/';
            } else {
                document.getElementById('loading-indicator').style.display = 'flex';
                window.location.href = pages[pageId];
            }
        }
    </script>
</body>
</html>
